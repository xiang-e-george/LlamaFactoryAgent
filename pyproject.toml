[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llamafactory-agent"
version = "0.1.0"
description = "通过远端 Docker 管理魔搭模型、文本数据集和 LlamaFactory 训练"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "docker>=7.1,<8",
  "python-multipart>=0.0.18",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9"]

[project.scripts]
lfa-api = "llamafactory_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llamafactory_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
